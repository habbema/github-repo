name: Deploy Static Site to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/azure-key
          chmod 600 ~/.ssh/azure-key
          # Debug: Verifique se a chave foi criada
          ls -la ~/.ssh

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/azure-key -o StrictHostKeyChecking=no \
            ${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_VM_IP }} "ls -la /var/www/html"

      - name: Deploy Files
        run: |
          rsync -avz --delete --progress -e "ssh -i ~/.ssh/azure-key -o StrictHostKeyChecking=no" \
            ./site/ ${{ secrets.AZURE_USERNAME }}@${{ secrets.AZURE_VM_IP }}:/var/www/html/